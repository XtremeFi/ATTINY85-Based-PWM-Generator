650" y="154" class="small" text-anchor="middle">+5V</text><line class="wire" x1="650" y1="495" x2="650" y2="520"/><line class="wire" x1="650" y1="520" x2="650" y2="532"/><line x1="632" y1="532" x2="668" y2="532"/><line x1="638" y1="539" x2="662" y2="539"/><line x1="644" y1="546" x2="656" y2="546"/><text x="690" y="525" class="small" text-anchor="start">GND</text><text x="785" y="357" class="small" text-anchor="end">P1</text><line class="wire" x1="800" y1="350" x2="910" y2="350"/><line class="wire" x1="910" y1="350" x2="950" y2="350"/><circle cx="950" cy="350" r="4"/><circle cx="1010" cy="350" r="4"/><line class="wire" x1="950" y1="350" x2="1000" y2="325"/><line class="wire" x1="1010" y1="350" x2="1080" y2="350"/><text x="975" y="300" class="head" text-anchor="middle">S1 RUN</text><text x="975" y="395" class="small" text-anchor="middle">OPEN during boot / upload</text><line class="wire" x1="1080" y1="350" x2="1095" y2="350"/><rect x="1095" y="340" width="65" height="20" rx="4"/><line class="wire" x1="1160" y1="350" x2="1175" y2="350"/><text x="1127" y="327" class="small" text-anchor="middle">Rin 1k</text><line class="wire" x1="1175" y1="350" x2="1280" y2="350"/><text x="1300" y="357" class="head" text-anchor="start">PWM_IN</text><circle class="node" cx="1230" cy="350" r="5"/><line class="wire" x1="1230" y1="350" x2="1230" y2="362"/><rect x="1220" y="362" width="20" height="50" rx="4"/><line class="wire" x1="1230" y1="412" x2="1230" y2="425"/><text x="1254" y="393" class="small" text-anchor="start">Rin_PD 10k</text><line class="wire" x1="1230" y1="425" x2="1230" y2="437"/><line x1="1212" y1="437" x2="1248" y2="437"/><line x1="1218" y1="444" x2="1242" y2="444"/><line x1="1224" y1="451" x2="1236" y2="451"/><text x="900" y="444" class="small" text-anchor="middle">+5V</text><line class="wire" x1="900" y1="455" x2="900" y2="480"/><line x1="882" y1="480" x2="918" y2="480"/><line x1="882" y1="489" x2="918" y2="489"/><line class="wire" x1="900" y1="489" x2="900" y2="520"/><text x="900" y="545" class="small" text-anchor="middle">GND</text><text x="930" y="488" class="small" text-anchor="start">100nF + 10uF</text><text x="55" y="555" class="small" text-anchor="start">S2: UPLOAD = USB branch; RUN = VR2 (USB unplugged). P5 unused. See README before cutting any traces.</text><rect x="30" y="605" width="1540" height="750" rx="4"/><text x="55" y="642" class="head" text-anchor="start">2. High-side driver — isolated supply for VB–VS; no bootstrap diode</text><rect x="100" y="700" width="330" height="140" rx="4"/><text x="265" y="732" class="" text-anchor="middle">Isolated regulated DC/DC</text><text x="265" y="764" class="small" text-anchor="middle">12V in / 12V out, &gt;=100mA</text><line class="wire" x1="60" y1="750" x2="100" y2="750"/><text x="60" y="690" class="small" text-anchor="start">+12V</text><line class="wire" x1="60" y1="810" x2="100" y2="810"/><line class="wire" x1="60" y1="810" x2="60" y2="822"/><line x1="42" y1="822" x2="78" y2="822"/><line x1="48" y1="829" x2="72" y2="829"/><line x1="54" y1="836" x2="66" y2="836"/><line class="wire" x1="430" y1="750" x2="490" y2="750"/><text x="443" y="735" class="small" text-anchor="start">OUT+ → VB</text><line class="wire" x1="430" y1="810" x2="490" y2="810"/><text x="443" y="835" class="small" text-anchor="start">OUT− → VS</text><text x="100" y="868" class="small" text-anchor="start">Do NOT connect OUT− to GND.</text><rect x="510" y="920" width="300" height="245" rx="4"/><text x="660" y="954" class="head" text-anchor="middle">IRS20752LTRPBF</text><text x="525" y="997" class="" text-anchor="start">1 VCC</text><line class="wire" x1="470" y1="990" x2="510" y2="990"/><text x="525" y="1067" class="" text-anchor="start">3 IN</text><line class="wire" x1="470" y1="1060" x2="510" y2="1060"/><text x="525" y="1137" class="" text-anchor="start">2 COM</text><line class="wire" x1="470" y1="1130" x2="510" y2="1130"/><text x="415" y="997" class="small" text-anchor="end">+12V</text><text x="457" y="1067" class