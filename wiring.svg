59"/><line class="wire" x1="1020" y1="759" x2="1020" y2="790"/><text x="1020" y="815" class="small" text-anchor="middle">VS</text><text x="1050" y="758" class="small" text-anchor="start">C7 100nF</text><text x="1350" y="714" class="small" text-anchor="middle">VB</text><line class="wire" x1="1350" y1="725" x2="1350" y2="750"/><line x1="1332" y1="750" x2="1368" y2="750"/><line x1="1332" y1="759" x2="1368" y2="759"/><line class="wire" x1="1350" y1="759" x2="1350" y2="790"/><text x="1350" y="815" class="small" text-anchor="middle">VS</text><text x="1380" y="758" class="small" text-anchor="start">C8 1uF / 25V</text><text x="55" y="1318" class="small" text-anchor="start">GND = Digispark GND = driver COM = load supply negative. VS is NOT ground.</text><text x="50" y="1395" class="head" text-anchor="start">500kHz + 5% / 95% means ~100ns pulses: Gate fidelity is NOT guaranteed with this driver.</text><text x="50" y="1430" class="small" text-anchor="start">Measure VGS with a suitable differential probe. Never clip an earth-ground scope lead to VS.</text><text x="50" y="1460" class="small" text-anchor="start">Same net names are connected. Functional pin placement shown; this is not a package top view. See README for setup.</text></svg>